services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./hivcare.db
      SECRET_KEY: dev-secret-change-in-production
      CORS_ORIGINS: http://localhost:5173
      ML_MODEL_PATH: /app/ml/artifacts/model.pkl
      ML_METRICS_PATH: /app/ml/artifacts/metrics.json
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
